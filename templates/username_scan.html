<h2>👤 Username Footprint Scan</h2>
<p>Find public accounts associated with a username across platforms.</p>

<form method="POST">
  <input
    type="text"
    name="username"
    placeholder="Enter username"
    required
  >
  <button type="submit">Run Username Scan</button>
</form>

{% if error %}
  <p style="color:red">{{ error }}</p>
{% endif %}
