<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chakravyuh OSINT Scanner</title>

  <style>
    /* ===============================
       ROOT FIX — REMOVE WHITE SCROLL
       =============================== */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background-color: #020617;
      overflow-x: hidden;
    }

    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    /* ===============================
       BODY — PREMIUM DARK BACKGROUND
       =============================== */
    body {
      min-height: 100vh;
      color: #e6f1f5;
      background:
        radial-gradient(800px 400px at 10% -10%, rgba(56,189,248,0.18), transparent 50%),
        radial-gradient(900px 500px at 90% 10%, rgba(94,234,212,0.16), transparent 55%),
        radial-gradient(700px 400px at 50% 100%, rgba(168,85,247,0.12), transparent 60%),
        linear-gradient(180deg, #030712 0%, #020617 60%, #020617 100%);
    }

    /* ===============================
       CONTAINER
       =============================== */
    .container {
      max-width: 820px;
      margin: 90px auto;
      padding: 42px 46px;
      background:
        linear-gradient(180deg, rgba(15,23,42,0.92), rgba(2,6,23,0.92));
      backdrop-filter: blur(16px);
      border-radius: 22px;
      box-shadow:
        0 40px 120px rgba(0,0,0,0.85),
        inset 0 0 0 1px rgba(94,234,212,0.12);
      animation: enter 0.9s ease forwards;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(30px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ===============================
       HEADINGS
       =============================== */
    h1 {
      text-align: center;
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #e5e7eb;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
      margin-bottom: 36px;
    }

    h3 {
      color: #5eead4;
      font-size: 16px;
      margin-bottom: 12px;
      letter-spacing: 0.4px;
    }

    hr {
      border: none;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(94,234,212,0.25), transparent);
      margin: 30px 0;
    }

    /* ===============================
       SCAN MODE CARDS
       =============================== */
    .scan-mode-wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      margin-top: 14px;
    }

    .scan-card {
      position: relative;
      padding: 22px 24px;
      border-radius: 18px;
      background: linear-gradient(180deg, #0b151b, #060c10);
      border: 1px solid rgba(94,234,212,0.18);
      cursor: pointer;
      transition: all 0.35s ease;
      overflow: hidden;
    }

    .scan-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 30px rgba(94,234,212,0.35);
      border-color: #5eead4;
    }

    .scan-card input { display: none; }

    .scan-card.active {
      border-color: #5eead4;
      box-shadow: 0 0 45px rgba(94,234,212,0.55);
    }

    .scan-title {
      font-size: 15px;
      font-weight: 700;
      color: #eafcff;
      margin-bottom: 6px;
    }

    .scan-desc {
      font-size: 13px;
      color: #8fb6c3;
      line-height: 1.55;
    }

    /* ===============================
       INPUTS
       =============================== */
    input[type="text"], textarea, select {
      width: 100%;
      padding: 16px 18px;
      background: #0b1216;
      border: 1px solid rgba(94,234,212,0.22);
      border-radius: 14px;
      color: #e6f1f5;
      margin-bottom: 16px;
      font-size: 14px;
      outline: none;
      transition: all 0.25s ease;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #5eead4;
      box-shadow: 0 0 0 2px rgba(94,234,212,0.25);
      background: #0c161c;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    /* ===============================
       FILE UPLOAD
       =============================== */
    .file-upload {
      margin-bottom: 20px;
    }

    .file-label {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, #0b1216, #0f1e25);
      border: 1px solid rgba(94,234,212,0.35);
      color: #9ffcff;
      cursor: pointer;
      font-weight: 600;
    }

    .file-label input { display: none; }

    .file-name {
      margin-top: 8px;
      text-align: center;
      font-size: 12px;
      color: #8fb6c3;
    }

    /* ===============================
       BUTTON
       =============================== */
    button {
      width: 100%;
      padding: 20px;
      border-radius: 18px;
      font-size: 16px;
      font-weight: 900;
      border: none;
      cursor: pointer;
      letter-spacing: 0.7px;
      color: #042f2e;
      background: linear-gradient(135deg, #5eead4, #38bdf8);
      box-shadow: 0 0 40px rgba(94,234,212,0.45);
      transition: all 0.3s ease;
    }
    

    button:hover {
      opacity: 0.95;
    }

    
  </style>

  <script>
    function toggleMode(mode) {
      document.getElementById("card-single").classList.toggle("active", mode === "single");
      document.getElementById("card-multi").classList.toggle("active", mode === "multi");
      document.getElementById("single-mode").style.display = mode === "single" ? "block" : "none";
      document.getElementById("multi-mode").style.display = mode === "multi" ? "block" : "none";
    }
  </script>
</head>

<body onload="toggleMode('single')">

<div class="container">

  <h1>RiskLens:Exposure Intelligence Platform</h1>
  <div class="subtitle">Multi-Platform Open Source Intelligence & Exposure Analysis</div>

  <form method="POST" action="/scan" enctype="multipart/form-data">

    <h3>Scan Mode</h3>

    <div class="scan-mode-wrapper">
      <label class="scan-card active" id="card-single" onclick="toggleMode('single')">
        <input type="radio" name="mode" value="single" checked>
        <div class="scan-title">Same Username</div>
        <div class="scan-desc">Scan one username across all platforms.</div>
      </label>

      <label class="scan-card" id="card-multi" onclick="toggleMode('multi')">
        <input type="radio" name="mode" value="platform">
        <div class="scan-title">Platform-wise Usernames</div>
        <div class="scan-desc">Different usernames per platform.</div>
      </label>
    </div>

    <hr>

    <div id="single-mode">
      <h3>Common Username</h3>
      <input type="text" name="single_username" placeholder="Enter username">
    </div>

    <div id="multi-mode" style="display:none;">
      <h3>Platform-wise Usernames</h3>
      <input type="text" name="instagram" placeholder="Instagram username">
      <input type="text" name="github" placeholder="GitHub username">
      <input type="text" name="facebook" placeholder="Facebook username">
      <input type="text" name="threads" placeholder="Threads username">
      <input type="text" name="reddit" placeholder="Reddit username">
      <input type="text" name="linkedin" placeholder="LinkedIn username">
    </div>

    <hr>

    <h3>📝 Text OSINT</h3>
    <textarea name="text_input" placeholder="Paste bio, post, leaked text..."></textarea>

  

    <h3>📁 Upload Media (Optional)</h3>

<div class="file-upload">
  <label class="file-label">
    🖼 Image File
    <input type="file" name="image_file" accept="image/*"
           onchange="showFileName(this, 'image-name')">
  </label>
  <div class="file-name" id="image-name">No file selected</div>
</div>

<div class="file-upload">
  <label class="file-label">
    🎥 Video File
    <input type="file" name="video_file" accept="video/*"
           onchange="showFileName(this, 'video-name')">
  </label>
  <div class="file-name" id="video-name">No file selected</div>
</div>

<div class="file-upload">
  <label class="file-label">
    🎧 Audio File
    <input type="file" name="audio_file" accept="audio/*"
           onchange="showFileName(this, 'audio-name')">
  </label>
  <div class="file-name" id="audio-name">No file selected</div>
</div>

    <button type="submit">🔍 Run OSINT Scan</button>

  </form>

</div>
<script>
  function showFileName(input, targetId) {
    const label = document.getElementById(targetId);
    if (input.files && input.files.length > 0) {
      label.textContent = "Selected: " + input.files[0].name;
    } else {
      label.textContent = "No file selected";
    }
  }
</script>
</body>
</html>
