<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Website Exposure Check</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg1:#0f172a;
  --bg2:#020617;
  --glass:rgba(15,23,42,.65);
  --border:rgba(148,163,184,.18);
  --accent1:#38bdf8;
  --accent2:#8b5cf6;
  --text:#e5e7eb;
  --muted:#94a3b8;
  --warn:#fbbf24;
}

*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  font-family:'Inter',sans-serif;
  background:
    radial-gradient(circle at 15% 20%, #1e293b, transparent 50%),
    radial-gradient(circle at 85% 80%, #1e293b, transparent 50%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* ===== MAIN CARD ===== */
.card{
  width:100%;
  max-width:880px;
  padding:70px 70px 60px;
  border-radius:32px;
  background:var(--glass);
  backdrop-filter:blur(22px);
  border:1px solid var(--border);
  box-shadow:
    0 50px 120px rgba(0,0,0,.65),
    inset 0 1px 0 rgba(255,255,255,.03);
  text-align:center;
  animation:fadeIn .7s ease-out;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}

/* ===== HEADER ===== */
.title{
  font-size:2.4rem;
  font-weight:700;
  margin-bottom:14px;
  background:linear-gradient(135deg,var(--accent1),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  letter-spacing:-0.5px;
}

.subtitle{
  font-size:1.05rem;
  color:var(--muted);
  margin-bottom:40px;
  line-height:1.6;
}

/* ===== FORM ===== */
.form{
  display:flex;
  gap:16px;
  margin-bottom:28px;
}

.form input{
  flex:1;
  padding:20px 22px;
  font-size:1rem;
  border-radius:16px;
  border:1px solid var(--border);
  background:#020617;
  color:white;
  transition:.25s ease;
}

.form input:focus{
  border-color:var(--accent1);
  box-shadow:0 0 0 3px rgba(56,189,248,.15);
  outline:none;
}

.form button{
  padding:20px 32px;
  border-radius:16px;
  border:none;
  font-weight:600;
  font-size:1rem;
  background:linear-gradient(135deg,var(--accent1),var(--accent2));
  color:#020617;
  cursor:pointer;
  transition:.25s ease;
  box-shadow:0 18px 45px rgba(139,92,246,.35);
}

.form button:hover{
  transform:translateY(-2px);
  box-shadow:0 22px 55px rgba(139,92,246,.45);
}

/* ===== ETHICAL NOTICE ===== */
.notice{
  display:inline-flex;
  align-items:center;
  gap:10px;
  margin-top:6px;
  padding:14px 20px;
  border-radius:14px;
  background:rgba(251,191,36,.08);
  border:1px solid rgba(251,191,36,.3);
  color:#fde68a;
  font-size:.9rem;
  backdrop-filter:blur(8px);
}

/* ===== TRUST BADGES ===== */
.badges{
  margin-top:32px;
  display:flex;
  justify-content:center;
  gap:32px;
  font-size:.85rem;
  color:#cbd5f5;
  opacity:.8;
}

.badges span{
  display:flex;
  align-items:center;
  gap:6px;
  transition:.2s ease;
}

.badges span:hover{
  opacity:1;
  transform:translateY(-1px);
}

/* ===== RESPONSIVE ===== */
@media(max-width:760px){
  .card{padding:50px 28px}
  .form{flex-direction:column}
  .badges{flex-direction:column;gap:14px}
}
</style>
</head>

<body>

<div class="card">

  <div class="title">🌐 Website Exposure Check</div>

  <div class="subtitle">
    Passive OSINT analysis to identify publicly accessible web
    misconfigurations and exposed resources.
  </div>

  <form method="POST" action="/web-exposure/scan" class="form">
    <input type="text" name="target"
           placeholder="example.com or https://site.com"
           required>
    <button type="submit">Run Exposure Scan</button>
  </form>

  <div class="notice">
    ⚠ Ethical OSINT only. No exploitation. No intrusion. Public data only.
  </div>

  <div class="badges">
    <span>🔍 Passive Analysis</span>
    <span>🛡 Misconfiguration Detection</span>
    <span>🎓 Research & Academic Safe</span>
  </div>

</div>

</body>
</html>
