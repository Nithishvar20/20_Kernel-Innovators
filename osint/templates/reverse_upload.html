<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reverse OSINT – Image Exposure</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg1: #070a12;
      --bg2: #0b1630;
      --glass: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.12);
      --accent1: #38d6ff;
      --accent2: #4f8cff;
      --text-dim: rgba(234,240,255,0.7);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(900px 600px at 15% 10%, rgba(56,214,255,0.14), transparent 60%),
        radial-gradient(700px 500px at 85% 80%, rgba(79,140,255,0.18), transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      font-family: "Segoe UI", Inter, system-ui, sans-serif;
      color: #eaf0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .card {
      width: 540px;
      background: linear-gradient(
        180deg,
        rgba(255,255,255,0.08),
        rgba(255,255,255,0.02)
      );
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 34px;
      backdrop-filter: blur(14px);
      box-shadow:
        0 30px 80px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.08);
      animation: fadeUp 0.6s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-block;
      padding: 6px 12px;
      font-size: 11px;
      letter-spacing: 0.08em;
      border-radius: 999px;
      text-transform: uppercase;
      color: #061126;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      margin-bottom: 14px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 30px;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 14px;
      color: var(--text-dim);
      line-height: 1.7;
      margin-bottom: 26px;
    }

    label {
      display: block;
      margin-top: 20px;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.02em;
    }

    input[type="file"],
    input[type="text"] {
      width: 100%;
      margin-top: 8px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.08);
      color: #eaf0ff;
      font-size: 14px;
      outline: none;
      transition: border 0.2s ease, background 0.2s ease;
    }

    input[type="file"] {
      padding: 10px;
    }

    input::placeholder {
      color: rgba(234,240,255,0.45);
    }

    input:focus {
      border-color: rgba(93,169,255,0.6);
      background: rgba(255,255,255,0.12);
    }

    .divider {
      margin: 18px 0;
      text-align: center;
      font-size: 12px;
      color: rgba(234,240,255,0.4);
      position: relative;
    }

    .divider::before,
    .divider::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 38%;
      height: 1px;
      background: rgba(255,255,255,0.12);
    }

    .divider::before {
      left: 0;
    }

    .divider::after {
      right: 0;
    }

    button {
      margin-top: 28px;
      width: 100%;
      height: 52px;
      border-radius: 16px;
      border: none;
      font-weight: 800;
      letter-spacing: 0.6px;
      background: linear-gradient(135deg, var(--accent2), var(--accent1));
      color: #061126;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 22px 60px rgba(79,140,255,0.45);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 30px 80px rgba(56,214,255,0.45);
    }

    .note {
      margin-top: 20px;
      font-size: 12px;
      color: rgba(234,240,255,0.55);
      text-align: center;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
      font-size: 13px;
      color: #5da9ff;
      text-decoration: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .back:hover {
      transform: translateX(-2px);
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <div class="card">
    <span class="badge">OSINT MODULE</span>

    <h1>Reverse Image Exposure</h1>

    <p>
      Detect public exposure, redistribution signals, and privacy risk indicators
      using ethical open-source intelligence techniques.
    </p>

    <form method="POST" enctype="multipart/form-data">
      <label>📸 Upload Image</label>
      <input type="file" name="image">

      <div class="divider">OR</div>

      <label>🌐 Public Image URL</label>
      <input type="text" name="image_url" placeholder="https://example.com/image.jpg">

      <button type="submit">Analyze Exposure</button>
    </form>

    <div class="note">
      Ethical OSINT only • No private viewer identification • No scraping behind logins
    </div>

    <a class="back" href="/">← Back to Home</a>
  </div>

</body>
</html>
