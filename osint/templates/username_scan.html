<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Username Exposure Check</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg: #020617;
  --card: #0b1224;
  --border: #1e293b;
  --accent: #38bdf8;
  --muted: #94a3b8;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Inter, system-ui, sans-serif;
  background: radial-gradient(circle at top, #0f172a, #020617);
  color: #e5e7eb;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ===== MAIN CARD ===== */

.card {
  width: 100%;
  max-width: 900px;
  background: linear-gradient(180deg, #0b1224, #050a18);
  border: 1px solid rgba(56,189,248,.35);
  border-radius: 22px;
  padding: 50px 60px;
  text-align: center;
  box-shadow: 0 40px 100px rgba(0,0,0,.7);
}

/* ===== TITLE ===== */

.card h1 {
  margin: 0 0 12px;
  font-size: 2rem;
  color: var(--accent);
}

.card p {
  color: var(--muted);
  margin-bottom: 32px;
  font-size: 1rem;
}

/* ===== FORM ===== */

.form {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  max-width: 520px;
  margin: 0 auto 30px;
}

.form input {
  padding: 15px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: #020617;
  color: white;
  font-size: 0.95rem;
}

.form button {
  padding: 15px 24px;
  border-radius: 10px;
  border: none;
  font-weight: 600;
  background: linear-gradient(135deg, #38bdf8, #8b5cf6);
  color: #020617;
  cursor: pointer;
}

/* ===== INFO STRIP ===== */

.notice {
  margin-top: 10px;
  padding: 12px;
  border-radius: 10px;
  background: rgba(56,189,248,.07);
  border: 1px solid rgba(56,189,248,.25);
  font-size: 0.85rem;
  color: #cbd5f5;
}

/* ===== FOOTER TAGS ===== */

.tags {
  margin-top: 28px;
  display: flex;
  justify-content: center;
  gap: 24px;
  font-size: 0.8rem;
  color: #94a3b8;
}

.tags span {
  display: flex;
  align-items: center;
  gap: 6px;
}
</style>
</head>

<body>

<div class="card">

  <h1>🔍 Username Exposure Check</h1>
  <p>Search where a username appears across publicly accessible platforms</p>

  <form method="POST" class="form">
    <input name="username" placeholder="Enter username" required>
    <button type="submit">Run Username Scan</button>
  </form>

  <div class="notice">
    This tool performs passive OSINT checks on public profiles only. No login, no private scraping.
  </div>

  <div class="tags">
    <span>🌐 Platforms: GitHub • Instagram • Twitter • Reddit • LinkedIn • Medium • Facebook • Dev.to</span>
  </div>

</div>

</body>
</html>
